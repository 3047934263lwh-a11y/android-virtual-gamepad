<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-label="系统架构：Android 手机通过 Wi-Fi UDP 连接 Windows PC，接收端经 vigem_native 交给 ViGEmBus 创建虚拟 Xbox 360 设备，游戏通过 XInput 读取">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="1120" height="400" fill="#FFFFFF"/>

  <!-- 左侧：手机 -->
  <rect x="24" y="36" width="300" height="328" rx="14" fill="#F7F9FC" stroke="#DBE2EA" stroke-width="1.5"/>
  <text x="44" y="68" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#0F172A">Android 手机 · 1P–4P</text>

  <rect x="44" y="88" width="260" height="60" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="60" y="112" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#0F172A">GamepadView</text>
  <text x="60" y="132" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#475569">摇杆 · 十字键 · ABXY · LT/RT · ☰</text>

  <rect x="44" y="164" width="260" height="60" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="60" y="188" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#0F172A">GyroAim</text>
  <text x="60" y="208" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#475569">陀螺仪 → 右摇杆（叠加生效）</text>

  <rect x="44" y="240" width="260" height="60" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="60" y="264" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#0F172A">UdpSender</text>
  <text x="60" y="284" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#475569">250 Hz 发送线程 · 回传接收</text>

  <path d="M 174 148 L 174 164" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 174 224 L 174 240" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 右侧：PC -->
  <rect x="796" y="36" width="300" height="328" rx="14" fill="#F7F9FC" stroke="#DBE2EA" stroke-width="1.5"/>
  <text x="816" y="68" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#0F172A">Windows PC</text>

  <rect x="816" y="84" width="260" height="56" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="832" y="107" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#0F172A">VirtualGamepadReceiver.exe</text>
  <text x="832" y="127" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#475569">UDP 接收 · 排空取最新 · 1P–4P</text>

  <rect x="816" y="156" width="260" height="56" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="832" y="179" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#0F172A">vigem_native</text>
  <text x="832" y="199" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#475569">IOCTL 提交报文 · 力反馈回调</text>

  <rect x="816" y="228" width="260" height="56" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="832" y="251" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#0F172A">ViGEmBus 内核驱动</text>
  <text x="832" y="271" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#475569">虚拟 Xbox 360 设备 ×4</text>

  <rect x="816" y="300" width="260" height="44" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="832" y="328" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#0F172A">游戏 / 模拟器（XInput）</text>

  <path d="M 946 140 L 946 156" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 946 212 L 946 228" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 946 284 L 946 300" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 中间：链路 -->
  <path d="M 332 256 L 786 256" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <path d="M 786 300 L 332 300" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>

  <text x="550" y="242" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2563EB">Wi-Fi / UDP　20 B @ 250 Hz（绝对状态）</text>
  <text x="550" y="320" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#475569">8 B 回传（震动强度 + 玩家编号）</text>
  <text x="550" y="356" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#94A3B8">丢包不累积：每帧发送完整状态，下一帧自动纠正</text>
</svg>
