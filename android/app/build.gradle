plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 正式签名：本地读 android/keystore.properties，CI 读环境变量（由 Actions Secret 注入）
def keystoreProps = new Properties()
def ksPropsFile = rootProject.file("keystore.properties")
if (ksPropsFile.exists()) {
    keystoreProps.load(new FileInputStream(ksPropsFile))
}
def envOr = { String envKey, String propKey ->
    System.getenv(envKey) ?: keystoreProps.getProperty(propKey)
}

android {
    namespace 'com.vgamepad'
    compileSdk 35

    defaultConfig {
        applicationId "com.vgamepad"
        minSdk 24
        targetSdk 35
        versionCode 33
        versionName "1.1.4"
    }

    signingConfigs {
        release {
            storeFile file(envOr("KEYSTORE_FILE", "storeFile"))
            storePassword envOr("KEYSTORE_PASSWORD", "storePassword")
            keyAlias envOr("KEY_ALIAS", "keyAlias")
            keyPassword envOr("KEY_PASSWORD", "keyPassword")
        }
    }

    buildTypes {
        release {
            // 2026-11-07 起改用正式签名（vgamepad-release.keystore）发布；
            // keep 规则只保留 XML inflate 所需的自定义 View 构造函数
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
