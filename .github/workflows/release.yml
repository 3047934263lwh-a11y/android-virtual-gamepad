name: 构建并发布 Release

# 推送 v* 标签时自动：构建正式签名 APK → 计算 SHA-256 → 发布 GitHub Release
# 前提：仓库 Secrets 已配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 校验版本号与标签一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          GRADLE_VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "标签=$TAG  versionName=$GRADLE_VER"
          if [ "$TAG" != "$GRADLE_VER" ]; then
            echo "::error::标签 v$TAG 与 versionName $GRADLE_VER 不一致，请修正后重新打标签"
            exit 1
          fi

      - name: 注入正式签名密钥（来自仓库 Secret）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret KEYSTORE_BASE64，请配置正式签名 keystore"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vgamepad-release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/vgamepad-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "签名密钥已就位：$(ls -la "$RUNNER_TEMP/vgamepad-release.keystore")"

      # 原用 gradle/actions/setup-gradle@v4，2026-11-08 起 services.gradle.org
      # 持续返回 504，构建在「下载 Gradle 发行包」这一步反复失败（与代码无关）。
      # 改为多镜像回退下载并手动放进 PATH，绕开单一分发源。
      - name: 安装 Gradle 8.9（多镜像回退）
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          urls=(
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip"
            "https://mirrors.aliyun.com/gradle/gradle-8.9-bin.zip"
            "https://downloads.gradle-dn.com/distributions/gradle-8.9-bin.zip"
            "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          )
          ok=0
          for u in "${urls[@]}"; do
            echo "::group::尝试下载 $u"
            if curl -fL --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 240 -o gradle.zip "$u"; then
              if unzip -q -o gradle.zip && [ -d gradle-8.9 ]; then ok=1; echo "下载成功"; fi
            fi
            echo "::endgroup::"
            if [ "$ok" = "1" ]; then break; fi
          done
          if [ "$ok" != "1" ]; then echo "::error::所有镜像下载 Gradle 均失败"; exit 1; fi
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: 构建正式签名 APK
        run: |
          cd android
          gradle assembleRelease --no-daemon --console=plain

      - name: 计算 SHA-256、改名并准备发布文件
        run: |
          OUT=android/app/build/outputs/apk/release
          APK=$(ls "$OUT"/*-release.apk "$OUT"/*-release-unsigned.apk 2>/dev/null | grep -v unsigned | head -1)
          test -n "$APK" || APK=$(ls "$OUT"/*.apk | head -1)
          NAME="VirtualGamepad-${GITHUB_REF_NAME}.apk"
          mv "$APK" "$OUT/$NAME"
          sha256sum "$OUT/$NAME" | awk '{print $1}' > "$OUT/$NAME.sha256"
          echo "APK: $NAME"
          echo "SHA-256: $(cat "$OUT/$NAME.sha256")"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }} 更新

            > 更新日志请编辑本 Release 的描述（手机端更新弹窗会显示这段文字）。
            > 如需强制更新，在描述中加入 `[force]` 标记。

            安装包与 `.sha256` 校验文件见下方附件，手机端应用内更新会自动校验。
          files: |
            android/app/build/outputs/apk/release/VirtualGamepad-*.apk
            android/app/build/outputs/apk/release/VirtualGamepad-*.sha256
