name: 构建并发布 Release

# 推送 v* 标签时自动：构建正式签名 APK → 计算 SHA-256 → 发布 GitHub Release
# 前提：仓库 Secrets 已配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 校验版本号与标签一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          GRADLE_VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "标签=$TAG  versionName=$GRADLE_VER"
          if [ "$TAG" != "$GRADLE_VER" ]; then
            echo "::error::标签 v$TAG 与 versionName $GRADLE_VER 不一致，请修正后重新打标签"
            exit 1
          fi

      # 历史教训：v1.1.1 及更早的 build.gradle 没有 signingConfigs 段，
      # 从那些标签构建出来的 APK 会被 AGP 用 debug 密钥签名，老用户装不上。
      # 这里在构建前就拦住，给出明确原因，而不是等到发布后才发现。
      - name: 校验构建脚本已声明正式签名
        run: |
          F=android/app/build.gradle
          if ! grep -q "signingConfigs" "$F" || ! grep -q "signingConfig signingConfigs.release" "$F"; then
            echo "::error::$F 未声明正式签名（缺 signingConfigs.release 或未在 release 中引用）。"
            echo "::error::从该提交构建会得到 debug 签名的 APK，已装正式版的用户无法覆盖安装。"
            echo "::error::v1.1.1 及更早的标签就属于这种情况，禁止用它们重新发版。"
            echo "::error::请从包含正式签名配置的提交（v1.1.2 及以后）构建，或先补上签名配置。"
            exit 1
          fi
          echo "已确认 release 构建使用正式签名配置"

      - name: 注入正式签名密钥（来自仓库 Secret）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret KEYSTORE_BASE64，请配置正式签名 keystore"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vgamepad-release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/vgamepad-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "签名密钥已就位：$(ls -la "$RUNNER_TEMP/vgamepad-release.keystore")"

      # 原用 gradle/actions/setup-gradle@v4，2026-11-08 起 services.gradle.org
      # 持续返回 504，构建在「下载 Gradle 发行包」这一步反复失败（与代码无关）。
      # 改为多镜像回退下载并手动放进 PATH，绕开单一分发源。
      - name: 安装 Gradle 8.9（多镜像回退）
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          urls=(
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip"
            "https://mirrors.aliyun.com/gradle/gradle-8.9-bin.zip"
            "https://downloads.gradle-dn.com/distributions/gradle-8.9-bin.zip"
            "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          )
          ok=0
          for u in "${urls[@]}"; do
            echo "::group::尝试下载 $u"
            if curl -fL --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 240 -o gradle.zip "$u"; then
              if unzip -q -o gradle.zip && [ -d gradle-8.9 ]; then ok=1; echo "下载成功"; fi
            fi
            echo "::endgroup::"
            if [ "$ok" = "1" ]; then break; fi
          done
          if [ "$ok" != "1" ]; then echo "::error::所有镜像下载 Gradle 均失败"; exit 1; fi
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: 构建正式签名 APK
        run: |
          cd android
          gradle assembleRelease --no-daemon --console=plain

      # 硬闸门：不论配置怎么写、AGP 是否静默降级，只要证书不是正式那把就绝不发布。
      # 正式证书指纹（vgamepad-release.keystore，CN=VirtualGamepad）
      - name: 校验 APK 签名证书
        run: |
          set -euo pipefail
          OUT=android/app/build/outputs/apk/release
          APK=$(ls "$OUT"/*-release.apk 2>/dev/null | grep -v unsigned | head -1 || true)
          test -n "$APK" || APK=$(ls "$OUT"/*.apk | head -1)
          echo "待校验 APK: $APK"

          # 该 APK 只启用 v2 签名方案（无 v1），META-INF 里没有证书文件，
          # 所以不能用 keytool 兜底，必须找到 apksigner 才具备校验能力。
          find_apksigner() {
            local d
            for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              [ -n "$d" ] && [ -d "$d/build-tools" ] || continue
              ls "$d"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 && return 0
            done
            return 1
          }
          APKSIGNER=$(find_apksigner || true)
          if [ -z "$APKSIGNER" ]; then
            echo "未找到 apksigner，尝试用 sdkmanager 安装 build-tools"
            for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
              [ -x "$d/cmdline-tools/latest/bin/sdkmanager" ] || continue
              yes | "$d/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" >/dev/null 2>&1 || true
              break
            done
            APKSIGNER=$(find_apksigner || true)
          fi
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::拿不到 apksigner，无法验证签名，拒绝发布（宁可不发，也不能发错签名的包）"
            exit 1
          fi
          echo "使用 apksigner: $APKSIGNER"

          FP=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          EXPECT="23e9a21b2af4e257ccb5db7051ccc8d314b518e4504aed33d40122eda51f0435"
          echo "APK 证书 SHA-256 : $FP"
          echo "期望正式证书      : $EXPECT"
          if [ "$FP" != "$EXPECT" ]; then
            echo "::error::APK 签名证书不匹配（实际 $FP）。"
            echo "::error::非正式签名的包发出去，已装用户无法覆盖安装，已阻止发布。"
            exit 1
          fi
          echo "签名证书校验通过"

      - name: 计算 SHA-256、改名并准备发布文件
        run: |
          OUT=android/app/build/outputs/apk/release
          APK=$(ls "$OUT"/*-release.apk "$OUT"/*-release-unsigned.apk 2>/dev/null | grep -v unsigned | head -1)
          test -n "$APK" || APK=$(ls "$OUT"/*.apk | head -1)
          NAME="VirtualGamepad-${GITHUB_REF_NAME}.apk"
          mv "$APK" "$OUT/$NAME"
          sha256sum "$OUT/$NAME" | awk '{print $1}' > "$OUT/$NAME.sha256"
          echo "APK: $NAME"
          echo "SHA-256: $(cat "$OUT/$NAME.sha256")"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # ⚠️ 严禁在本模板（以及任何 Release 描述）里写入「强制更新标记」的字面量。
          # 手机端 UpdateManager 用 body.contains(FORCE_MARKER) 判定强制更新，
          # 一旦命中：弹窗不可关闭、没有「暂不更新」、点外部也关不掉，用户会被卡死。
          # 2026-11-08 曾因模板里带了一句开发提示而误触发，已清除；改动前请先读
          # docs/自动更新系统-教程.md 的「发布前检查」一节。
          body: |
            ## ${{ github.ref_name }} 更新

            > 更新日志请编辑本 Release 的描述（手机端更新弹窗会显示这段文字）。

            安装包与 `.sha256` 校验文件见下方附件，手机端应用内更新会自动校验。
          files: |
            android/app/build/outputs/apk/release/VirtualGamepad-*.apk
            android/app/build/outputs/apk/release/VirtualGamepad-*.sha256
