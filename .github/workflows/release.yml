name: 构建并发布 Release

# 推送 v* 标签时自动：构建 APK → 计算 SHA-256 → 发布 GitHub Release
# 前提：仓库 Secrets 中已配置 DEBUG_KEYSTORE_BASE64（debug.keystore 的 base64）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 校验版本号与标签一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          GRADLE_VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "标签=$TAG  versionName=$GRADLE_VER"
          if [ "$TAG" != "$GRADLE_VER" ]; then
            echo "::error::标签 v$TAG 与 versionName $GRADLE_VER 不一致，请修正后重新打标签"
            exit 1
          fi

      - name: 注入签名密钥（debug.keystore，来自仓库 Secret）
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret DEBUG_KEYSTORE_BASE64，请按教程配置"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          echo "签名密钥已就位：$(ls -la ~/.android/debug.keystore)"

      - name: 安装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 构建 APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --console=plain

      - name: 计算 SHA-256 并准备发布文件
        run: |
          OUT=android/app/build/outputs/apk/debug
          APK=$(ls "$OUT"/*.apk | head -1)
          BASE=$(basename "$APK")
          sha256sum "$APK" | awk '{print $1}' > "$OUT/$BASE.sha256"
          echo "APK: $BASE"
          echo "SHA-256: $(cat "$OUT/$BASE.sha256")"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }} 更新

            > 更新日志请编辑本 Release 的描述（手机端更新弹窗会显示这段文字）。
            > 如需强制更新，在描述中加入 `[force]` 标记。

            安装包与 `.sha256` 校验文件见下方附件，手机端应用内更新会自动校验。
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.sha256
